components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        referralCode:
          type: string
      required: [name, email, password]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string
      required: [user, token]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, manager, customer]
        referralCode:
          type: string
        pushToken:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, name, email, role, referralCode, createdAt]

    UpdateProfileBody:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        pushToken:
          type: string
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameBn:
          type: string
          nullable: true
        slug:
          type: string
        imageUrl:
          type: string
          nullable: true
        productCount:
          type: integer
      required: [id, name, slug, productCount]

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        nameBn:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
      required: [name, slug]

    Brand:
