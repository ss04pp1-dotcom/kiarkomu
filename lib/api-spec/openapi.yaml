      required: [id, name, productCount]

    CreateBrandBody:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: string
      required: [name]

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameBn:
          type: string
          nullable: true
        slug:
          type: string
        price:
          type: number
        originalPrice:
          type: number
          nullable: true
        discountPercent:
          type: integer
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        categoryId:
          type: integer
        categoryName:
          type: string
        brandId:
          type: integer
          nullable: true
        brandName:
          type: string
          nullable: true
        stock:
          type: integer
        isActive:
          type: boolean
        isFast:
          type: boolean
        avgRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        createdAt:
          type: string
      required: [id, name, slug, price, categoryId, categoryName, stock, isActive, isFast, reviewCount, createdAt]

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            description:
              type: string
              nullable: true
            specifications:
              type: object
              nullable: true
              additionalProperties: true
            images:
              type: array
              items:
                type: string
            variants:
              type: array
              items:
                $ref: "#/components/schemas/ProductVariant"
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/Review"
          required: [images, variants, reviews]

    ProductVariant:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        value:
          type: string
        priceModifier:
          type: number
        stock:
          type: integer
      required: [id, type, value, priceModifier, stock]

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        nameBn:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        categoryId:
          type: integer
        brandId:
          type: integer
        stock:
          type: integer
        isActive:
          type: boolean
        isFast:
          type: boolean
        thumbnailUrl:
          type: string
        images:
          type: array
          items:
            type: string
        specifications:
          type: object
          additionalProperties: true
      required: [name, slug, price, categoryId, stock]

    ProductsPage:
      type: object
      properties:
